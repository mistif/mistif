name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions and the Claude Code CLI are pinned, like every other dependency in this repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Validate the marketplace and every plugin (warnings are errors)
        run: |
          claude plugin validate . --strict
          for p in plugins/*/; do claude plugin validate "$p" --strict; done
      - name: Run the mistif hook tests (hud, effort, explain, lean, agents)
        # one retry in case a slow runner times a test out
        run: |
          export CLAUDE_CODE_ENABLE_FUNCTION_HOOKS=1
          claude plugin test plugins/mistif || claude plugin test plugins/mistif
      - name: Run the Python tests (scripts, explain, guard)
        working-directory: plugins/mistif
        run: python -m unittest tests.similarity_test tests.explain_script_test tests.guard_test
